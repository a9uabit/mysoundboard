[package]
name = "mysoundboard"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# common
leptos = "0.8.20"
leptos_meta = "0.8.6"
leptos_router = "0.8.15"
serde = "1.0.229"
anyhow = "1.0.104"
slotmap = { version = "1.1.1", features = ["serde"] }

# web server
axum = { version = "0.8.9", optional = true }
leptos_axum = { version = "0.8.10", optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "signal"], optional = true }
qrcode = { version = "0.14.1", optional = true }
local-ip-address = { version = "0.6.13", optional = true }
tokio-util = { version = "0.7.19", optional = true }

# backend
poise = { version = "0.7.0", optional = true }
serde_json = { version = "1.0.151", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true }
tracing = { version = "0.1.44", optional = true }
songbird = { version = "0.6.0", optional = true }
symphonia = { version = "0.5", features = ["wav", "mp3", "ogg"] }

# client
wasm-bindgen = { version = "0.2.128", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }

[features]
ssr = [
  "leptos/ssr",
  "leptos_router/ssr",
  "leptos_meta/ssr",
  "dep:axum",
  "dep:leptos_axum",
  "dep:tokio",
  "backend",
]

backend = [
  "dep:qrcode",
  "dep:local-ip-address",
  "dep:poise",
  "dep:serde_json",
  "dep:tracing-subscriber",
  "dep:tracing",
  "dep:songbird",
  "dep:tokio-util",
]

hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:console_error_panic_hook"]

[package.metadata.leptos]
assets-dir = "public"

site-addr = "0.0.0.0:3000"

bin-features = ["ssr"]
bin-default-features = false

lib-features = ["hydrate"]
lib-default-features = false
